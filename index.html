<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>封閉型AI_yeable</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #f4f7f6; 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            height: 95vh; 
            margin: 0 auto; 
            max-width: 800px; 
        }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        h2 { font-size: 1.2rem; margin: 0; }
        #chat { flex: 1; overflow-y: auto; background: white; border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 10px; display: flex; flex-direction: column; }
        .msg { margin-bottom: 10px; padding: 10px; border-radius: 10px; line-height: 1.5; max-width: 85%; word-wrap: break-word; font-size: 1rem; }
        .user { background: #007bff; color: white; align-self: flex-end; }
        .ai { background: #e9e9eb; color: #333; align-self: flex-start; }
        
        /* 圖片預覽區 */
        #preview-area { display: none; position: relative; margin-bottom: 10px; align-self: flex-start; }
        #img-preview { max-height: 150px; border-radius: 8px; border: 2px solid #28a745; }
        .del-img { position: absolute; top: -10px; right: -10px; background: red; color: white; border-radius: 50%; width: 25px; height: 25px; border: none; cursor: pointer; font-size: 14px; font-weight: bold; }

        /* 批次掃描列 */
        .batch-group { display: flex; gap: 5px; margin-bottom: 10px; background: #fff; padding: 8px; border-radius: 8px; border: 1px dashed #6f42c1; }
        .batch-group input { flex: 1; padding: 5px; font-size: 13px; border: 1px solid #ddd; border-radius: 4px; }
        .batch-btn { background: #6f42c1; color: white; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; white-space: nowrap; }

        .input-group { display: flex; gap: 8px; align-items: center; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; }
        button { padding: 10px 18px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 8px; font-weight: bold; font-size: 16px; }
        .cam-btn { background: #6f42c1; }
        .model-info { font-size: 11px; color: #666; margin-bottom: 5px; }
        .clear-btn { background: #6c757d; padding: 5px 10px; font-size: 12px; }
    </style>
</head>

<body>

<header>
    <h2>yeable_5060ti封閉型AI運算站Ver1.25</h2>
    <button class="clear-btn" onclick="clearChat()">清除記憶</button>
</header>

<div class="model-info">模型:(Qwen3-VL-8B-Thinking)</div>

<div class="batch-group">
    <input type="text" id="folder-path" placeholder="輸入本地資料夾絕對路徑 (例如 C:\Photos)">
    <button class="batch-btn" onclick="scanFolder()"> 批次掃描圖檔</button>
</div>

<div id="chat">
    <div class="msg ai">主人，請輸入訊息或上傳圖片。若要處理大量文件，請在上方輸入資料夾路徑。</div>
</div>

<div id="preview-area">
    <button class="del-img" onclick="cancelImage()">×</button>
    <img id="img-preview" src="">
</div>

<div class="input-group">
    <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="handleFile(this)">
    <button class="cam-btn" onclick="document.getElementById('file-input').click()">📷</button>
    <input type="text" id="inp" placeholder="輸入訊息..." onkeypress="if(event.key==='Enter') send()">
    <button onclick="send()" id="btn">發送</button>
</div>

<script>
const BASE_URL = "https://ai-test.yeablemax.org";
let currentBase64Image = null;

function handleFile(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (e) {
        document.getElementById('img-preview').src = e.target.result;
        document.getElementById('preview-area').style.display = 'block';
        currentBase64Image = e.target.result.split(',')[1];
    };
    reader.readAsDataURL(file);
}

function cancelImage() {
    currentBase64Image = null;
    document.getElementById('file-input').value = "";
    document.getElementById('preview-area').style.display = 'none';
}

// 🚀 新增：掃描資料夾功能
async function scanFolder() {
    const path = document.getElementById('folder-path').value.trim();
    if (!path) {
        alert("主人，請先輸入有效的資料夾路徑。");
        return;
    }

    addMsg('user', `請幫我辨識資料夾內的所有圖片,並依序標註123給我csv格式：${path}`);
    const aiDiv = addMsg('ai', '正在掃描資料夾並進行批次辨識，這可能需要一點時間...');

    try {
        const res = await fetch(`${BASE_URL}/batch_scan`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ folder_path: path })
        });

        if (!res.ok) throw new Error(`批次任務啟動失敗 (${res.status})`);

        const reader = res.body.getReader();
        const decoder = new TextDecoder("utf-8");
        aiDiv.innerText = "";

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            aiDiv.innerText += decoder.decode(value, { stream: true });
            document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
        }
    } catch (e) {
        aiDiv.innerText = "❌ 批次處理出錯：" + e.message;
    }
}

async function send() {
    const inp = document.getElementById('inp');
    const btn = document.getElementById('btn');
    const chat = document.getElementById('chat');
    const text = inp.value.trim();
    if (!text && !currentBase64Image) return;

    addMsg('user', text + (currentBase64Image ? " [🖼️ 圖片]" : ""));
    const imageToSend = currentBase64Image;
    cancelImage(); 
    inp.value = '';
    btn.disabled = true;

    const aiDiv = addMsg('ai', '思考中...');
    try {
        const res = await fetch(`${BASE_URL}/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: text, image: imageToSend })
        });
        const reader = res.body.getReader();
        const decoder = new TextDecoder("utf-8");
        aiDiv.innerText = "";
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            aiDiv.innerText += decoder.decode(value, { stream: true });
            chat.scrollTop = chat.scrollHeight;
        }
    } catch (e) {
        aiDiv.innerText = "❌ 連線錯誤：" + e.message;
    } finally {
        btn.disabled = false;
        inp.focus();
    }
}

function addMsg(role, txt) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerText = txt;
    const chat = document.getElementById('chat');
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
}

function clearChat() {
    if (confirm("確定清除對話？")) {
        document.getElementById('chat').innerHTML = '<div class="msg ai">對話已重置。</div>';
    }
}
</script>
</body>
</html>
