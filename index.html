<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無審查AI_yeable</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #f4f7f6; 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            height: 95vh; 
            margin: 0 auto; 
            max-width: 800px; 
        }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        h2 { font-size: 1.2rem; margin: 0; }
        #chat { flex: 1; overflow-y: auto; background: white; border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 10px; display: flex; flex-direction: column; }
        .msg { margin-bottom: 10px; padding: 10px; border-radius: 10px; line-height: 1.5; max-width: 85%; word-wrap: break-word; font-size: 1rem; }
        .user { background: #007bff; color: white; align-self: flex-end; }
        .ai { background: #e9e9eb; color: #333; align-self: flex-start; }
        .input-group { display: flex; gap: 8px; }
        input { flex: 1; padding: 15px; border-radius: 8px; border: 1px solid #ddd; font-size: 18px; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 8px; font-weight: bold; font-size: 16px; }
        .model-info { font-size: 11px; color: #666; margin-bottom: 5px; }
        .clear-btn { background: #6c757d; padding: 5px 10px; font-size: 12px; }
    </style>
</head>

<body>

<header>
    <h2>yeable_5060ti地端運算站Ver1.16</h2>
    <button class="clear-btn" onclick="clearChat()">清除記憶</button>
</header>

<div class="model-info">模型：maid (Qwen3-14B-Q6；人格設定:女僕)</div>

<div id="chat">
    <div class="msg ai">準備就緒！以下均由 yeable 自家顯卡計算，請開始對話。</div>
</div>

<div class="input-group">
    <input type="text" id="inp" placeholder="輸入訊息..." onkeypress="if(event.key==='Enter') send()">
    <button onclick="send()" id="btn">發送</button>
</div>

<script>

const BASE_URL = "https://ai-test.yeablemax.org";

async function send() {
    const inp = document.getElementById('inp');
    const btn = document.getElementById('btn');
    const chat = document.getElementById('chat');

    const text = inp.value.trim();
    if (!text) return;

    addMsg('user', text);
    inp.value = '';
    btn.disabled = true;

    const aiDiv = addMsg('ai', '思考中...');

    try {
        const res = await fetch(`${BASE_URL}/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: text })
        });

        if (!res.ok) {
            throw new Error(`連線失敗 (${res.status})`);
        }

        // 🔥 Streaming 核心
        const reader = res.body.getReader();
        const decoder = new TextDecoder("utf-8");

        aiDiv.innerText = "";

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value, { stream: true });
            aiDiv.innerText += chunk;

            chat.scrollTop = chat.scrollHeight;
        }

    } catch (e) {
        console.error(e);
        aiDiv.innerText = "❌ 錯誤：" + e.message;
        aiDiv.style.color = "red";
    } finally {
        btn.disabled = false;
        inp.focus();
    }
}

function addMsg(role, txt) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerText = txt;
    const chat = document.getElementById('chat');
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
}

function clearChat() {
    if (confirm("確定要清除目前畫面上的對話嗎？")) {
        document.getElementById('chat').innerHTML =
            '<div class="msg ai">對話已清除。</div>';
    }
}

</script>

</body>
</html>
